name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build app bundle
        run: |
          brew install opus
          sh scripts/build-app.sh
      - name: Validate app metadata
        run: |
          plutil -lint OpenRayneoBridge.app/Contents/Info.plist
          test -x OpenRayneoBridge.app/Contents/MacOS/openrayneo-bridge
      - name: Package release zip
        run: |
          OPENRAYNEO_SIGNING_IDENTITY=- sh scripts/package-release.sh
          ls -la .build/distributions/*/
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRayneo-release-macos
          path: .build/distributions/*/OpenRayneo-*.zip
